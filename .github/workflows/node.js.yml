# GitHub Actions CI/CD workflow for Portfolio Manager Backend
# This workflow installs dependencies, builds, and deploys the backend on push to main

name: Backend CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted
    
    defaults:
      run:
        working-directory: Portfolio_manager_backend
    
    strategy:
      matrix:
        node-version: [20.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: Portfolio_manager_backend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Create .env file from secrets
      run: |
        touch .env
        echo "${{ secrets.PROD_ENV_FILE }}" > .env

    - name: Check PM2 status
      run: |
        if pm2 describe BackendAPI > /dev/null 2>&1; then
          echo "BackendAPI process exists, will restart"
        else
          echo "BackendAPI process does not exist, will start"
        fi

    - name: Deploy with PM2 (start or restart BackendAPI)
      run: |
        if pm2 describe BackendAPI > /dev/null 2>&1; then
          pm2 restart BackendAPI
          echo "BackendAPI restarted successfully"
        else
          pm2 start server.js --name BackendAPI
          echo "BackendAPI started successfully"
        fi
        pm2 save

