name: Backend CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: backend-deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Backend on Self-Hosted Runner
    runs-on: self-hosted
    strategy:
      matrix:
        node-version: [22.x]

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write production .env file
        shell: bash
        run: |
          printf "%s" "${{ secrets.ENV }}" > .env

      - name: Run database migrations
        run: npm run migrate

      - name: Restart API with PM2
        shell: bash
        run: |
          pm2 describe BackendAPI > /dev/null \
            && pm2 restart BackendAPI \
            || pm2 start server.js --name BackendAPI
          pm2 save
