name: Node.js CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Portfolio_manager_backend

    strategy:
      matrix:
        node-version: [21.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: Portfolio_manager_backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install PM2
        run: npm install -g pm2

      - name: Write environment file
        run: |
          touch .env
          echo "${{ secrets.DB_HOST }}" > .env

      - name: Deploy with PM2 (start or restart BackendAPI)
        run: |
          if pm2 describe BackendAPI > /dev/null 2>&1; then
            pm2 restart BackendAPI
          else
            pm2 start server.js --name BackendAPI
          fi


